# Generated by tools/docs-site/build.py in the Lygard repository; edit there, not here.
site_name: Lygard
site_description: A lightweight, secure ingress gateway and Kubernetes ingress controller.
site_url: https://lygard-ingress.github.io/
copyright: Copyright The Lygard Authors. Apache License 2.0.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
validation:
  links: {not_found: warn, anchors: warn}
nav:
